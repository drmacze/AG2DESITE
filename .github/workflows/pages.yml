name: Deploy AG2 site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate developer console JavaScript
        run: |
          node --check dev-console/console.js
          node --check dev-console/auth-compat.js
          node --check dev-console/creator-debugger.js
          node --check dev-console/runtime-config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Configure developer console runtime
        env:
          DEV_CONSOLE_ACCESS_SHA256: ${{ secrets.DEV_CONSOLE_ACCESS_SHA256 }}
          AG2_SUPABASE_URL: ${{ secrets.AG2_SUPABASE_URL }}
          AG2_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.AG2_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          # The URL and publishable key are intentionally safe for browser use.
          # Repository secrets can override them without changing the source.
          default_url = "https://ydaeukhqwishlrjyfktk.supabase.co"
          default_key = "sb_publishable_XNXU6SVeM-D477Ymy1ORsw_4hCHOll9"
          url = os.getenv("AG2_SUPABASE_URL") or default_url
          key = os.getenv("AG2_SUPABASE_PUBLISHABLE_KEY") or default_key
          cfg = {
              "backend": {
                  "enabled": bool(url and key),
                  "provider": "supabase",
                  "url": url,
                  "publishableKey": key,
                  "ingestFunction": "debug-ingest",
              },
              "accessHash": os.getenv("DEV_CONSOLE_ACCESS_SHA256", ""),
          }
          Path('dev-console/runtime-config.js').write_text(
              'window.AG2_RUNTIME_CONFIG = ' + json.dumps(cfg, separators=(',', ':')) + ';\n'
              'if (window.AG2_RUNTIME_CONFIG.accessHash) window.AG2_DEV_ACCESS_HASH = window.AG2_RUNTIME_CONFIG.accessHash;\n',
              encoding='utf-8'
          )

          path = Path('dev-console/index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<script src="console.js?v=2"></script>'
          runtime = '<script src="runtime-config.js?v=2"></script>'
          auth = '<script src="auth-compat.js?v=2"></script>'
          html = html.replace('<script src="runtime-config.js?v=1"></script>', runtime)
          if runtime not in html:
              html = html.replace(marker, runtime + '\n  ' + auth + '\n  ' + marker)
          elif auth not in html:
              html = html.replace(marker, auth + '\n  ' + marker)

          nav_marker = '<button class="nav-item" data-view="upload"><svg><use href="#ic-upload"/></svg><span>ContentLog</span></button>'
          creator_link = '<a class="nav-item" href="creator-debugger.html" style="text-decoration:none"><svg><use href="#ic-terminal"/></svg><span>Creator Debugger</span><b>NEW</b></a>'
          if creator_link not in html and nav_marker in html:
              html = html.replace(nav_marker, nav_marker + '\n        ' + creator_link)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
